# Valores por defecto de la base de datos - edítalos para tu entorno
# Ejemplo:
# db.host=localhost
# db.port=3306
# db.database=abarrey_db
# db.user=root
# db.password=secret

db.host=localhost
db.port=3306
db.database=abarrey_db
db.user=root
db.password=root
# Parámetros JDBC: sin SSL y con zona horaria del servidor
db.params=useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
