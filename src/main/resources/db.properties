## Database configuration for AbarreyApp (example)
# Edit these values to match your local MySQL setup.
# Recommended: create a dedicated app user (see README_es.md and commands below).

# Host and port
db.host=localhost
db.port=3306

# Database name (init_db.sql will create 'abarrey_db')
db.database=abarrey_db

# Application user (example user created by the helper SQL below)
db.user=abarrey_user
db.password=ChangeMe123!

# Additional JDBC params
db.params=useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# NOTE: Do NOT commit real production credentials. Update these values for your
# local environment before running the application. If you prefer to use 'root',
# set db.user=root and db.password to the root password; or create the example user
# below and use those credentials.
