# Archivo de propiedades de base de datos para la distribución sin Maven
# Ajusta los valores según tu entorno local

db.host=localhost
# puerto MySQL
db.port=3306
# nombre de la base de datos (el script init_db.sql crea 'abarrey_db')
db.database=abarrey_db
# usuario y contraseña de MySQL (ajusta según tu entorno)
db.user=root
# si usas contraseña, actualízala aquí
db.password=
# parámetros JDBC por defecto
db.params=useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
